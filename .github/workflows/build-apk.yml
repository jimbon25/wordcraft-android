name: Build WordCraft Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download & Bundle Official WordCraft Web Assets
        run: |
          mkdir -p app/src/main/assets/wordcraft
          curl -sSL -o wordcraft-web.zip https://github.com/storytold/wordcraft/releases/download/v0.10.0/wordcraft-web-0.10.0.zip
          unzip -q wordcraft-web.zip -d /tmp/wc_extract
          cp -r /tmp/wc_extract/wordcraft-web-0.10.0/* app/src/main/assets/wordcraft/
          rm -rf /tmp/wc_extract wordcraft-web.zip
          python3 tools/patch_index.py app/src/main/assets/wordcraft/index.html

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.jks -alias wordcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wordcraft -keypass wordcraft \
            -dname "CN=WordCraft, OU=Android, O=Storytold, L=City, S=State, C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/app-release.apk release_apk/WordCraft-v0.10.0-android.apk
          ls -lh release_apk/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-v0.10.0-Android-APK
          path: release_apk/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WordCraft Android ${{ github.ref_name }}
          files: release_apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## WordCraft for Android (Offline APK)

            Clean-room open-source Microsoft Word-compatible word processor running offline on Android & Xiaomi Pad 7.

            ### Features
            - **Microsoft Word Desktop UI:** Full ribbon tabs, live styles gallery, ruler, tables, footnotes, track changes, APA/MLA citations.
            - **Word .docx Compatibility:** Open and save `.docx`, `.odt`, `.rtf`, `.md`, and export to PDF.
            - **Optimized for Tablets:** Hardware-accelerated 120Hz/144Hz WebGL2/WebGPU on Xiaomi Pad 7 with full physical keyboard & shortcut support (`Ctrl+B`, `Ctrl+S`, `Ctrl+Z`, `Ctrl+C`, `Ctrl+V`, `F7`).
            - **100% Offline:** Assets, WebAssembly engine, and document processing run locally on the device with zero network traffic.
            - **Seamless Storage:** Built-in Android storage integration for opening documents and exporting directly to `Downloads/WordCraft/`.
